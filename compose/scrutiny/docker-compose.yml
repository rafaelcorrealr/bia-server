name: big-bear-scrutiny

# Monitor S.M.A.R.T health of hard drives.
# Adjust the `devices` list to match your disk layout (check with: lsblk).
services:
  scrutiny:
    container_name: big-bear-scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
    ports:
      - "38080:8080"  # WebUI
      - "38086:8086"  # InfluxDB
    volumes:
      - /DATA/AppData/big-bear-scrutiny/config:/opt/scrutiny/config
      - /DATA/AppData/big-bear-scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
