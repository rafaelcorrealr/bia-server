name: poupa-db

services:
  poupa-db:
    container_name: poupa-db
    image: postgres:16
    restart: unless-stopped
    network_mode: bridge
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: poupamercado
      POSTGRES_PASSWORD: ${POUPA_DB_PASSWORD}
      POSTGRES_DB: poupamercado
    ports:
      - "5432:5432"
    volumes:
      - /DATA/AppData/poupa-db:/var/lib/postgresql/data
